spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  kafka:
    bootstrap-servers: ${KAFKA_HOST}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jwt:
    secret: ${JWT_SECRET_KEY}

  discord:
    error-webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}
    verify-photo-webhook-url: ${DISCORD_VERIFYPHOTO_WEBHOOK_URL:}

logging:
  level:
    kr.ac.ssu.ssutoday: info

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      endpoint: ${AWS_S3_ENDPOINT}
      region: ${AWS_S3_REGION}
    stack:
      auto: false

ssutoday:
  attestation:
    enforce: ${ATTESTATION_ENFORCE:false}
    play-integrity:
      cloud-project-number: ${PLAY_CLOUD_PROJECT_NUMBER:997341830534}
      credentials: ${PLAY_INTEGRITY_CREDENTIALS:}
      package-name: com.ssutoday
      certificate-sha256: ${PLAY_APP_SIGNING_CERTIFICATE_SHA256:30:B0:61:28:59:F6:64:57:59:11:18:AC:CD:A3:98:B4:D9:D9:C4:AE:CC:BE:C0:A5:11:40:99:B4:22:CE:2F:ED}
    app-attest:
      team-id: ${APPLE_TEAM_ID:F7TW6722Y9}
      bundle-id: com.ssutoday
      production: ${APP_ATTEST_PRODUCTION:true}
  admin:
    base-url: ${ADMIN_BASE_URL:}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY:}
  kafka:
    topics:
      push-message: ${PUSH_MESSAGE_TOPIC:pushMessage}
      reservation-request: ${RESERVATION_REQUEST_TOPIC:requestReserve}
      verify-photo-inspection: ${VERIFY_PHOTO_INSPECTION_TOPIC:verifyPhotoInspection}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-3.5-flash-lite
    enforce: false
    reject-threshold: 0.9
  storage:
    verify-photo-bucket: ${VERIFY_PHOTO_BUCKET:ssutoday}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
  firebase:
    credentials: ${FIREBASE_CREDENTIALS:firebase.json}
