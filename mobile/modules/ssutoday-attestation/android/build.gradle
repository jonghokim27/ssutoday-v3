plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ssutoday'
version = '0.1.0'

android {
  namespace 'com.ssutoday.attestation'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.google.android.play:integrity:1.6.0'
  testImplementation 'junit:junit:4.13.2'
}
