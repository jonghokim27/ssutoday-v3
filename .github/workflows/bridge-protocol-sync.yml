name: Bridge and attestation checks

on:
  pull_request:
    paths:
      - '.github/workflows/bridge-protocol-sync.yml'
      - 'frontend/package*.json'
      - 'frontend/src/shared/native/**'
      - 'frontend/src/shared/storage/appStorage.ts'
      - 'frontend/src/features/reservation/api/*Photo*'
      - 'frontend/src/features/reservation/api/reservationRepository.ts'
      - 'frontend/src/features/reservation/api/registerIosAppAttest.ts'
      - 'frontend/src/features/reservation/api/requestReserveWithAttestation.ts'
      - 'mobile/src/bridge/**'
      - 'scripts/*attestation*'
      - 'scripts/ios-registration.test.mjs'
      - 'scripts/*bridge*'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bridge-protocol-sync.yml'
      - 'frontend/package*.json'
      - 'frontend/src/shared/native/**'
      - 'frontend/src/shared/storage/appStorage.ts'
      - 'frontend/src/features/reservation/api/*Photo*'
      - 'frontend/src/features/reservation/api/reservationRepository.ts'
      - 'frontend/src/features/reservation/api/registerIosAppAttest.ts'
      - 'frontend/src/features/reservation/api/requestReserveWithAttestation.ts'
      - 'mobile/src/bridge/**'
      - 'scripts/*attestation*'
      - 'scripts/ios-registration.test.mjs'
      - 'scripts/*bridge*'

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check bridge protocol files are in sync
        run: node scripts/check-bridge-protocol-sync.js

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test attestation flow and bridge boundaries
        run: node --test scripts/attestation-flow.test.mjs scripts/reservation-attestation.test.mjs scripts/ios-registration.test.mjs scripts/bridge-security.test.mjs scripts/bridge-transport.test.mjs

      - name: Build frontend
        run: npm run build
        working-directory: frontend
